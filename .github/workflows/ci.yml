# CI — tests unitaires + intégration + build smoke (.oxt) à chaque push/PR.
# Le plugin n'a AUCUNE dépendance pip (stdlib + stubs UNO) : seul pytest est
# installé. Le build smoke (test_build_oxt_smoke.py) exécute réellement
# scripts/02-build-oxt.sh (zip/unzip/git sont présents sur ubuntu-latest).
name: CI

on:
  push:
    branches: [master, develop, "fix/**", "feat/**", "exp-jetable/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: pip install pytest

      - name: Tests unitaires + intégration + build smoke
        run: python -m pytest tests/unit tests/integration -q
